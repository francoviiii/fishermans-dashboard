document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

' },\n          { n: '2', t: 'Roadmap de testes — o que entra na fila, em que ordem, e o critério de corte e de escala de cada lote.' },\n          { n: '3', t: 'Criação ponta a ponta — briefa e dirige copy, edição, design e gravação (filmmaker, storymaker, agência); o que vai ao ar sai dela.' },\n          { n: '4', t: 'Verba mensal de criação — aloca entre UGC, gravações, atores e materiais, dentro do envelope aprovado (T6).' },\n          { n: '5', t: 'Biblioteca de criativos — o repertório de ângulos, hooks e formatos da casa, mantido vivo pelo que performa.' },\n          { n: '6', t: 'Co-input no sistema de escala — alimenta a leitura criativa; a decisão de escala é do Gestor de Tráfego.' },\n        ],\n        fronteira: 'não é dona de verba de mídia, compra de mídia e estrutura de campanha (Gestor de Tráfego); nem de preço, oferta e posicionamento — política de marca (N3, T6).',\n        resultados: [\n          { n: '1', t: 'Cadência sustentada — ≥ [N] criativos novos/semana no ar nas marcas sob sua responsabilidade, sem semana zerada no trimestre.' },\n          { n: '2', t: 'Portfólio de escaláveis crescendo — mais vencedores entregues a cada período que o anterior (T11).' },\n          { n: '3', t: 'Receita de clientes novos vinda de criativo batendo o período anterior, mantendo a eficiência-alvo da conta (T11).' },\n          { n: '4', t: 'Sistema criativo que roda sem depender do gestor — padrões e biblioteca em 100% dos criativos novos.' },\n        ],\n        n1: [\n          'Aprovar briefing e liberar peça para produção; aprovar, reprovar, mandar refazer.',\n          'Definir o conceito (persona + ângulo + oferta) e a prioridade da fila de testes.',\n          'Matar conceito, persona, ângulo ou hook que não performa.',\n          'Acionar ou dispensar criador e alocar filmagem + UGC até 5% do orçamento previsto em ads.',\n        ],\n        n2: [\n          'Mudar a aposta criativa principal do trimestre (tese de personas e ângulos).',\n          'Mudar meta / cadência de produção da marca.',\n          'Aprovar oferta nova (bundle, GWP, evergreen, reposicionamento) que feche na margem modelada.',\n          'Fechar criador recorrente (UGC / partnership) dentro do envelope mensal.',\n        ],\n        n3: [\n          'Desconto, mudança de preço ou arquitetura de oferta que mexa na margem / ROAS-alvo.',\n          'Peça com pessoa real ou influenciador que exija contrato ou cessão de imagem.',\n          'Mudança de posicionamento da marca (é política, não peça).',\n          'Filmagem / UGC acima dos 5% do orçamento previsto em ads.',\n        ],\n        reversibilidade: 'Testar e matar conceito, persona, ângulo, oferta ou formato é reversível → decide rápido (~70% da info); é onde o erro é barato. Mexer em preço/margem, imagem de pessoa real ou posicionamento é caro de desfazer → devagar, N3.',\n        calibracao: 'Teto de filmagem + UGC = 5% do orçamento previsto em ads (escala com a verba de mídia). Toda oferta nova modela a cascata de margem + stacking no Shopify antes do ar — desconto não é oferta.',\n        kpiSupremo: 'Margem de contribuição (receita líquida − produto − frete − gateway − impostos − aquisição). Lida toda semana, antes da weekly (Dashboard no ClickUp).',\n        kpis: [\n          { tipo: 'Alavanca', nome: 'Criativos novos no ar / semana — contagem de anúncios novos no Gerenciador.', meta: '≥ [meta] /sem · semanal' },\n          { tipo: 'Resultado', nome: 'Vencedores novos / semana + mês — criativos que passaram de [R$ X] de gasto mantendo ROAS ≥ alvo (7d-click, cliente novo).', meta: 'Bater o período anterior · semanal + mensal' },\n          { tipo: 'Resultado', nome: 'Receita de cliente novo (Meta) / semana + mês — receita de clientes de 1ª compra (7-day click).', meta: 'Bater o período anterior · semanal + mensal' },\n          { tipo: 'Resultado', nome: 'ROAS 7d-click, cliente novo — receita ÷ gasto, excluindo clientes existentes.', meta: '≥ média das últimas 4 semanas · semanal' },\n          { tipo: 'Alavanca · Guardrail', nome: 'Frequência em cold — média no público frio, janela de 15 dias, por marca.', meta: '< 4 · 15d · semanal' },\n        ],\n        pendencias: [\n          'Meta de criativos novos/semana em branco no T11 v2.1 / T18 — o mesmo número fecha o Resultado 1.',\n          'Limiar de gasto do vencedor [R$ X] em aberto — calibração aponta R$ 700/semana (R$ 2.000/mês) com ROAS ≥ 4,0.',\n          'Dono divergente entre fontes (T18 Diretor de Marca · T6 Mateus · T11 Estrategista) — assumido Diretor de Marca.',\n        ],\n      },\n      b2b: {\n        cargo: 'Gestor de B2B', respondeA: 'Diretor de Marca', dono: 'Diretor de Marca', revisao: 'Julho de 2026',\n        missao: 'Construir e liderar uma rede de revendedores que recompra — receita recorrente de alta margem, feita pelo trabalho do time, não por desconto.',\n        escopo: [\n          { n: '1', t: 'Rede de revendedores — onde crescer (cobertura regional, eventos, prospecção), quem entra pelos critérios e a saúde da rede: revendedor que gira e recompra.' },\n          { n: '2', t: 'Time de vendas — carteira, territórios e metas dentro do plano; coaching, produtividade e conflito de conta.' },\n          { n: '3', t: 'Relação comercial com a rede — condições, bonificações e exceções dentro da política; guardião do MAP e da margem-piso.' },\n          { n: '4', t: 'Sell-through — apoio de PDV, treinamento e co-marketing pra rede girar; sell-in que não gira não conta como venda.' },\n          { n: '5', t: 'Orçamento comercial do canal — aloca eventos, amostras, kits e apoio à rede dentro do envelope aprovado (T6).' },\n        ],\n        fronteira: 'não é dono de preço de tabela, modelo de comissão e MAP / margem-piso — política comercial (N3, T6); nem de logística e expedição (Operações); nem de marketplace e varejo D2C (outras áreas).',\n        resultados: [\n          { n: '1', t: 'Faturamento total do B2B ≥ R$ 250 mil por período, sustentado nos 3 meses — líquido de devoluções e cancelamentos (Bling).' },\n          { n: '2', t: 'Time produtivo — ≥ 75% dos vendedores batendo a meta individual de R$ 50 mil em cada período.' },\n          { n: '3', t: 'Qualidade do faturamento — sem sell-in de estoque parado, sem bonificação fora da faixa (3–5%), margem e sell-through preservados.' },\n          { n: '4', t: 'Rede girando e recomprando — revendedor ativo repetindo pedido no trimestre, sem número puxado por desconto.' },\n        ],\n        n1: [\n          'Distribuir carteira, contas e território entre vendedores e resolver conflito de conta.',\n          'Aprovar bonificação de 3–5% e exceções pontuais (dentro da tabela e dos kits, tiers R$ 2,5k–20k).',\n          'Priorizar alocação de estoque escasso entre pedidos / vendedores quando falta produto.',\n          'Onboardar revendedor dentro dos critérios e aprovar apoio de sell-through dentro do orçamento.',\n        ],\n        n2: [\n          'Definir e ajustar metas do time dentro do plano e remanejar conta-chave entre vendedores.',\n          'Promover vendedor ou ajustar comissionamento dentro da política.',\n          'Definir onde crescer a rede — cobertura regional e quais eventos prospectar (ex.: Fishing Show).',\n          'Definir o mix de kits e advertir ou suspender revendedor por quebra de MAP.',\n        ],\n        n3: [\n          'Contratar ou desligar vendedor; mudar tamanho ou estrutura do time.',\n          'Mudar modelo de comissionamento ou plano de metas.',\n          'Compromisso anual / de volume com conta-chave; exclusividade territorial; corte de revendedor relevante.',\n          'Bonificação acima de 5% ou que fure margem-piso / MAP; aprovar revendedor fora dos critérios.',\n        ],\n        reversibilidade: 'Distribuir carteira, bonificar na faixa, onboardar e apoiar sell-through é reversível → rápido; é onde o time e a rede se constroem. Contratar/desligar, mudar comissão, exclusividade, compromisso anual e furar MAP são caros de desfazer → devagar, N3.',\n        calibracao: 'Bonificação à revenda = 3–5% (acima disso, N3). Plano de metas e modelo de comissão vivem na política comercial; MAP / margem-piso já vivem na política — linkar, não duplicar.',\n        kpiSupremo: 'Faturamento total do B2B (líquido de devoluções e cancelamentos), puxado pelo trabalho do time, sem sell-in que não gira nem queima de preço. Lido toda semana, antes da weekly.',\n        kpis: [\n          { tipo: 'Resultado', nome: 'Faturamento total do canal — B2B no período, líquido de devoluções e cancelamentos (Bling).', meta: '≥ R$ 250 mil · lido semanalmente' },\n          { tipo: 'Alavanca', nome: '% do time de vendas na meta — vendedores que bateram a meta individual de R$ 50 mil (CRM / planilha).', meta: '≥ 75% · lido semanalmente' },\n        ],\n        pendencias: [\n          'T18 desatualizado vs T11 novo — subir T18 pra v1.1 com os Resultados reescritos.',\n          'Janela das metas não explicitada — R$ 250 mil e R$ 50 mil/vendedor \"no período\" (5 × R$ 50 mil sugere janela mensal).',\n          'Só 2 KPIs no T11 — template pede 3 a 5; candidato a 3º é um guardrail de qualidade.',\n          'Dono divergente (T18 Diretor de Marca · T6 Mateus · T11 Gestor de B2B) — assumido Diretor de Marca.',\n        ],\n      },\n\n      organicoFish: {\n        cargo: 'Gestão de Conteúdo Orgânico · Fishermans', respondeA: 'Felipe (co-founder)', dono: 'Felipe', revisao: 'Julho de 2026 · trimestral',\n        missao: 'Construir audiência própria que traz cliente a custo marginal quase zero — conteúdo que viaja pra fora da base derruba o CAC combinado e alimenta o criativo pago.',\n        escopo: [\n          { n: '1', t: 'Calendário e produção de conteúdo da Fishermans (pauta → checklist → publicação).' },\n          { n: '2', t: 'Teste de formato/hook e replicação do padrão vencedor.' },\n          { n: '3', t: 'Comunidade orgânica: respostas, reposts e collabs (em par com a Marcela, com registro).' },\n          { n: '4', t: 'Leitura semanal do ranking (alcance de não-seguidores + EQ) com decisão registrada.' },\n          { n: '5', t: 'Troca de padrão vencedor com a cadeira espelhada — formato que vence numa marca é testado na outra, com registro.' },\n        ],\n        fronteira: 'NÃO é dona de verba (impulsionar/Spark/criativo pago = Creative), da régua de receita (Receita Orgânica UTM mora no OKR do Felipe) nem do conteúdo da outra marca.',\n        resultados: [\n          { n: '1', t: 'Piso de produção sustentado — 3 vídeos verticais + 2 posts/carrosséis por semana — por 2 trimestres seguidos.' },\n          { n: '2', t: 'EQ ≥ 1% sustentado no semestre, com % de alcance de não-seguidores estável ou subindo.' },\n          { n: '3', t: '≥ 2 conteúdos vencedores em toda janela móvel de 4 semanas a partir do fechamento do baseline (out/2026), com CTR do link em tendência de alta.' },\n        ],\n        n1: [\n          'Publicar o que está no calendário aprovado e passou no checklist.',\n          'Hooks, variações e a ordem/horário da semana.',\n          'Trend na janela de 24–48h com formato já validado.',\n          'Aceitar collab e repostar cliente/influencer que passe nos critérios de aceite.',\n          'Regravar ou arquivar peça fraca antes de subir.',\n          'Testar na minha marca o padrão vencedor que veio da cadeira espelhada.',\n        ],\n        n2: [\n          'Collabs e convites a influencers — decide em par com a Marcela e registra.',\n          'Formato ou série nova dentro da cadência (registra no report).',\n          'Aposentar formato que morreu no dado (3 semanas em queda).',\n          'Ajuste de cadência em semana atípica (feriado, drop, diária cancelada).',\n        ],\n        n3: [\n          'Claim sensível ou comparação nominal a concorrente.',\n          'Mudar o mix de pilares ou a cadência-base.',\n          'Qualquer verba (teto do cargo: R$ 0) — impulsionar, Spark Ads e criativo pago são orçamento do Creative.',\n          'Resposta pública em crise.',\n          'Plataforma nova, ferramenta nova ou custo recorrente.',\n          'Publicar na conta da outra marca ou assumir a cadeira espelhada.',\n        ],\n        reversibilidade: 'Post comum é reversível — apaga e regrava; decide rápido, com ~70% da informação. Irreversível sobe mesmo dentro da alçada: resposta pública sensível, imagem de pessoa sem autorização, claim que encosta em doença, compromisso com terceiro.',\n        calibracao: 'O pago contamina o orgânico — medir no substrato limpo: seguidor nunca é KPI, EQ e vencedores só em posts não impulsionados, alcance de anúncios excluído no Insights, receita só de links de stories/Reels (nunca da bio). Vencedor definido por alcance de não-seguidores no top 10% do baseline da Fishermans. Nenhum número é somado entre as duas marcas.',\n        kpiSupremo: 'Taxa de Vencedores — posts não impulsionados com alcance de não-seguidores no top 10% do baseline da Fishermans. Lida semanalmente em janela móvel de 4 semanas.',\n        kpis: [\n          { tipo: 'Resultado', nome: 'Taxa de Vencedores — posts não impulsionados no top 10% de alcance de não-seguidores ÷ publicados na janela.', meta: '≥ 2 por janela de 4 semanas · semanal' },\n          { tipo: 'Alavanca', nome: 'Piso de Produção — peças publicadas ÷ planejadas no calendário.', meta: '100% (3 vídeos + 2 posts/sem) · semanal' },\n          { tipo: 'Resultado', nome: 'Engajamento Qualificado (EQ) — (salvamentos + compartilhamentos) ÷ alcance, só em posts não impulsionados.', meta: '≥ 1%, tendência subindo · semanal' },\n          { tipo: 'Resultado', nome: 'CTR do Link — cliques ÷ alcance nos posts com link (stories e Reels, UTM próprio).', meta: 'Baseline 90d, tendência subindo · semanal' },\n        ],\n        pendencias: ['Baseline 90d fecha em out/2026 — meta da Taxa de Vencedores é provisória até lá.'],\n      },\n\n      organicoAristo: {\n        cargo: 'Gestão de Conteúdo Orgânico · O Aristocrata', respondeA: 'Felipe (co-founder)', dono: 'Felipe', revisao: 'Julho de 2026 · trimestral',\n        missao: 'Construir audiência própria que traz cliente a custo marginal quase zero — conteúdo que viaja pra fora da base derruba o CAC combinado e alimenta o criativo pago.',\n        escopo: [\n          { n: '1', t: 'Calendário e produção de conteúdo d\\u2019O Aristocrata (pauta → checklist → publicação).' },\n          { n: '2', t: 'Teste de formato/hook e replicação do padrão vencedor.' },\n          { n: '3', t: 'Comunidade orgânica: respostas, reposts e collabs (em par com a Marcela, com registro).' },\n          { n: '4', t: 'Leitura semanal do ranking (alcance de não-seguidores + EQ) com decisão registrada.' },\n          { n: '5', t: 'Troca de padrão vencedor com a cadeira espelhada — formato que vence numa marca é testado na outra, com registro.' },\n        ],\n        fronteira: 'NÃO é dona de verba (impulsionar/Spark/criativo pago = Creative), da régua de receita (Receita Orgânica UTM mora no OKR do Felipe) nem do conteúdo da outra marca.',\n        resultados: [\n          { n: '1', t: 'Piso de produção sustentado — 3 vídeos verticais + 2 posts/carrosséis por semana — por 2 trimestres seguidos.' },\n          { n: '2', t: 'EQ ≥ 1% sustentado no semestre, com % de alcance de não-seguidores estável ou subindo.' },\n          { n: '3', t: '≥ 2 conteúdos vencedores em toda janela móvel de 4 semanas a partir do fechamento do baseline (out/2026), com CTR do link em tendência de alta.' },\n          { n: '4', t: 'Rampa dos primeiros 90 dias: o resultado que conta é o piso de produção; EQ, vencedores e CTR entram como leitura (não cobrança) até o fechamento do baseline.' },\n        ],\n        n1: [\n          'Publicar o que está no calendário aprovado e passou no checklist.',\n          'Hooks, variações e a ordem/horário da semana.',\n          'Trend na janela de 24–48h com formato já validado.',\n          'Aceitar collab e repostar cliente/influencer que passe nos critérios de aceite.',\n          'Regravar ou arquivar peça fraca antes de subir.',\n          'Testar na minha marca o padrão vencedor que veio da cadeira espelhada.',\n        ],\n        n2: [\n          'Collabs e convites a influencers — decide em par com a Marcela e registra.',\n          'Formato ou série nova dentro da cadência (registra no report).',\n          'Aposentar formato que morreu no dado (3 semanas em queda).',\n          'Ajuste de cadência em semana atípica (feriado, drop, diária cancelada).',\n          'Entrante · 90 dias: trend fora do calendário sobe pra N2 até o fechamento do primeiro trimestre.',\n        ],\n        n3: [\n          'Claim sensível ou comparação nominal a concorrente.',\n          'Mudar o mix de pilares ou a cadência-base.',\n          'Qualquer verba (teto do cargo: R$ 0) — impulsionar, Spark Ads e criativo pago são orçamento do Creative.',\n          'Resposta pública em crise.',\n          'Plataforma nova, ferramenta nova ou custo recorrente.',\n          'Publicar na conta da outra marca ou assumir a cadeira espelhada.',\n        ],\n        reversibilidade: 'Post comum é reversível — apaga e regrava; decide rápido, com ~70% da informação. Irreversível sobe mesmo dentro da alçada: resposta pública sensível, imagem de pessoa sem autorização, claim que encosta em doença, compromisso com terceiro.',\n        calibracao: 'O pago contamina o orgânico — medir no substrato limpo: seguidor nunca é KPI, EQ e vencedores só em posts não impulsionados, receita só de links de stories/Reels. Vencedor definido por alcance de não-seguidores no top 10% do baseline d\\u2019O Aristocrata. Entrante: o N1 completo abre na revisão, com julgamento demonstrado.',\n        kpiSupremo: 'Taxa de Vencedores — posts não impulsionados com alcance de não-seguidores no top 10% do baseline d\\u2019O Aristocrata. Lida semanalmente em janela móvel de 4 semanas.',\n        kpis: [\n          { tipo: 'Resultado', nome: 'Taxa de Vencedores — posts não impulsionados no top 10% de alcance de não-seguidores ÷ publicados na janela.', meta: '≥ 2 por janela de 4 semanas · semanal' },\n          { tipo: 'Alavanca', nome: 'Piso de Produção — peças publicadas ÷ planejadas no calendário.', meta: '100% (3 vídeos + 2 posts/sem) · semanal' },\n          { tipo: 'Resultado', nome: 'Engajamento Qualificado (EQ) — (salvamentos + compartilhamentos) ÷ alcance, só em posts não impulsionados.', meta: '≥ 1%, tendência subindo · semanal' },\n          { tipo: 'Resultado', nome: 'CTR do Link — cliques ÷ alcance nos posts com link (stories e Reels, UTM próprio).', meta: 'Baseline 90d, tendência subindo · semanal' },\n        ],\n        pendencias: ['Baseline herdado da operação anterior — reconfirmado em out/2026.'],\n      },\n\n      influencia: {\n        cargo: 'Gestora de Influência & Afiliados', respondeA: 'Felipe (co-founder)', dono: 'Felipe', revisao: 'Julho de 2026 · trimestral',\n        missao: 'Trazer cliente rastreável mais barato que a mídia paga — afiliado com CPA travado abaixo da margem por desenho, influencer com venda rastreada + alcance que baixa o CAC combinado + UGC que alimenta o anúncio campeão.',\n        escopo: [\n          { n: '1', t: 'Roster de creators e afiliados (prospecção → ativação → corte).' },\n          { n: '2', t: 'Programa de afiliados (regras, comissão, reposição).' },\n          { n: '3', t: 'Pipeline de influência (briefing → contrato padrão → compliance).' },\n          { n: '4', t: 'Ponte de UGC pro Creative (Mateus).' },\n          { n: '5', t: 'Atribuição cupom + UTM das duas frentes.' },\n        ],\n        fronteira: 'NÃO é dona da mídia paga (Creative) nem do atendimento ao cliente (CX/Samuel).',\n        resultados: [\n          { n: '1', t: 'Baseline 90d das duas Receitas Rastreadas firmado e tendência subindo por 2 trimestres seguidos.' },\n          { n: '2', t: 'ROI de influencers ≥ 3× sustentado no semestre, com dashboard de CPM equivalente no ar.' },\n          { n: '3', t: 'Compliance de entrega ≥ 95% no fechamento de cada trimestre.' },\n        ],\n        n1: [\n          'Prospecção, seleção e contato dentro do perfil e do orçamento de permuta.',\n          'Kit/permuta dentro do teto; parceria paga até R$ 1.500.',\n          'Briefing de colab na linha da marca.',\n          'Aprovar afiliado dentro do critério e tocar a rotina.',\n          'Testar e matar abordagem que não performa (reversível).',\n        ],\n        n2: [\n          'Aposta de influência do período (perfis, ângulos, mix permuta × pago).',\n          'Parceria paga de R$ 1.501 a R$ 3.000 dentro do envelope.',\n          'Mudar regras/comissão de afiliados, com registro.',\n          'Contrato de colab no modelo padrão (prazo + entrega + multa).',\n          'Alçada de entrada do time.',\n        ],\n        n3: [\n          'Parceria paga de R$ 3.001 a R$ 10.000 ou contrato fora do padrão.',\n          'Compromisso anual com plataforma.',\n          'Cessão de imagem com contrato jurídico.',\n          'Claim de saúde no conteúdo do criador.',\n          'Ação que afete preço/posicionamento. Acima de R$ 10 mil: Felipe decide com Mateus e João (capital).',\n        ],\n        reversibilidade: 'Contato, permuta e teste de criador são reversíveis → rápido (~70% da info). Contrato pago, compromisso longo e cessão de imagem são caros de desfazer → devagar, mesmo dentro da alçada.',\n        calibracao: 'Permuta — Fishermans: 2 linhas de 150 m (nano) / 150–300 m (micro a macro); Aristocrata: 3 sabonetes; acima do teto, consulta. Comissão fixa sobre venda: Fishermans 15% · Aristocrata 22% (converge pra 15% quando os grupos consolidarem — mudança é N2, com registro). Contrato sempre no modelo padrão; todo percentual entra no contrato antes de qualquer pagamento.',\n        kpiSupremo: 'Receita Rastreada (afiliados + influencers) trazendo cliente mais barato que a mídia paga, com ROI ≥ 3× e compliance de entrega em dia.',\n        kpis: [\n          { tipo: 'Resultado', nome: 'Receita Rastreada Afiliados — receita atribuída (cupom + UTM), R$, por marca.', meta: 'Baseline 90d, tendência subindo · semanal' },\n          { tipo: 'Resultado', nome: 'ROAS Afiliados — receita rastreada ÷ investimento total (comissões + produto + plataforma).', meta: 'Estruturalmente positivo · mensal' },\n          { tipo: 'Alavanca', nome: 'Afiliados Ativos / mês — nº com ≥ 1 venda atribuída + novos ativados ÷ base.', meta: 'Mínimo por marca + reposição · mensal' },\n          { tipo: 'Resultado', nome: 'Receita Rastreada Influencers — receita atribuída (cupom + UTM), R$, por marca.', meta: 'Baseline 90d, tendência subindo · semanal' },\n          { tipo: 'Resultado', nome: 'ROI Influencers — receita rastreada ÷ investimento (fixo + permuta a custo + frete).', meta: '≥ 3× saudável · mensal' },\n          { tipo: 'Alavanca', nome: 'Compliance de Entrega — entregues no escopo (formato + prazo + menções) ÷ contratados.', meta: '≥ 95% · semanal' },\n        ],\n        pendencias: [],\n      },\n\n      cx: {\n        cargo: 'Líder de CS / CX', respondeA: 'Felipe (co-founder)', dono: 'Felipe', revisao: 'Julho de 2026 · trimestral',\n        missao: 'Segurar o cliente que custou caro pra adquirir — resolução rápida e verdadeira que contém o custo (reembolso e bonificação são margem que vaza), protege a reputação que sustenta a conversão do pago e devolve LTV.',\n        escopo: [\n          { n: '1', t: 'Atendimento das duas marcas em todos os canais (Gleap, e-mail SAC, Reclame Aqui, WhatsApp crítico).' },\n          { n: '2', t: 'Políticas, macros e artigos de ajuda + alçada interna do time (agentes e líderes de marca).' },\n          { n: '3', t: 'Leitura semanal de motivos com causa-raiz roteada pra área dona, com contagem como evidência.' },\n          { n: '4', t: 'Compensações com justificativa registrada no ClickUp.' },\n          { n: '5', t: 'Contestações e reversão de cancelamento.' },\n        ],\n        fronteira: 'NÃO é dono da causa a montante — atraso/extravio é logística, defeito/expectativa é produto, promessa que não bate é copy/Creative; o CS roteia com evidência, não absorve.',\n        resultados: [\n          { n: '1', t: 'CSAT com baseline firmado e ≥ 85–90% sustentado no semestre, nas duas marcas.' },\n          { n: '2', t: 'RA com nota ≥ 8,0, resposta 100% e resolução ≥ 90% em todos os meses — rumo ao selo RA1000.' },\n          { n: '3', t: 'Custo de Resolução estável ou caindo vs. baseline em todo trimestre.' },\n          { n: '4', t: 'Zero compensação sem justificativa registrada no ano.' },\n        ],\n        n1: [\n          'Gestão do time: cobrar métrica, rendimento, tom e qualidade (N1 e N2), dar feedback, rodar QA e cross-training.',\n          'Processo e tooling: desenhar, documentar e otimizar fluxos/SOPs; ajustar Gleap, Replient, WhatsApp prioritário e automações de triagem.',\n          'Ponto final do caso ambíguo que a N2 não resolve.',\n          'Compensação dentro do padrão (após o Forms Reembolso), até reembolso total.',\n          'PROCON de rotina — o RA operacional é do time (João).',\n        ],\n        n2: [\n          'Exceção pontual de política, com registro no VoC/relatório (devolução de usado/danificado, troca fora do padrão, caso-limite).',\n          'Mudar macro/SOP, SLA e régua de qualidade do time, com registro.',\n          'Definir a alçada de entrada do time e o escopo de cross-training/contingência.',\n          'Resposta pública dentro da política que precise subir.',\n        ],\n        n3: [\n          'Mudar a Política de Reembolso/compensação ou criar regra que vale pra todos.',\n          'Mexer na estrutura do time: contratar, desligar, redefinir reporte ou dar gestão de pessoas às N2.',\n          'Caso com risco jurídico/imagem alto (≠ PROCON de rotina).',\n          'Compensação que destoa do padrão a ponto de afetar a margem.',\n          'Bloquear cliente ou acionar o jurídico.',\n          'Compromisso anual com ferramenta de CX, ou decisão que afete outra marca/frente.',\n        ],\n        reversibilidade: 'Gerir o time, ajustar processo/macro, rodar QA, compensar dentro do padrão (pós-retenção) e responder no tom é reversível → decide rápido (~70% da info). Mudar política, mexer na estrutura do time, expor a marca, tratar dado de cliente ou criar precedente jurídico é caro de desfazer → devagar, N3.',\n        calibracao: 'Régua de compensação (Forms Reembolso, campo Nível 0–3): N1 retenção (agente) — cupom até 10%, 1 por cliente a cada 90 dias, nenhum dinheiro de volta · N2 compensação (líder da marca) — estorno do frete, estorno parcial até 15%, cupom de caso crítico até 15% · N3 reembolso total (Samuel) — acima de 15% ou total, só em caso confirmado. Anti-abuso: 3+ bonificações em 90 dias congelam cortesia e sobem pra N3. Medição: Gleap em horas úteis e mediana; painel sempre por marca.',\n        kpiSupremo: 'Custo de Resolução — (reembolsos Shopify + bonificações ClickUp com justificativa) ÷ faturamento. É a margem que vaza; lido junto ao Top 5 de motivos pra separar culpa do CS da culpa da origem.',\n        kpis: [\n          { tipo: 'Alavanca', nome: 'Tempo de Resolução — mediana entre abertura e fechamento (Gleap, horas úteis).', meta: 'Chat mesmo dia útil · e-mail < 24h · semanal' },\n          { tipo: 'Resultado', nome: 'CSAT — avaliações positivas ÷ respondidas, workflow do Gleap pós-resolução, por marca.', meta: '≥ 85–90% positivo · semanal' },\n          { tipo: 'Resultado', nome: 'Custo de Resolução — (reembolsos + bonificações com justificativa) ÷ faturamento.', meta: 'Baseline 90d → estável ou caindo · mensal' },\n          { tipo: 'Resultado', nome: 'Índice Reclame Aqui — nota, % de resposta e % de resolução lidos juntos.', meta: 'Nota ≥ 8,0 · resposta 100% · resolução ≥ 90%' },\n        ],\n        pendencias: ['Quando a deflexão por autoatendimento (Replient + Help Center) ficar medível, ela entra como KPI e o painel reequilibra.'],\n      },\n    };\n  }\n\n  DATA() {\n    return {\n r Despacho', d: 'Fishermans' },\n            { id: 'desp-aristo', t: 'Líder Despacho', d: 'O Aristocrata' },\n            { id: 'desp-aux', t: 'Aux. Produção / Despacho', d: 'rotação' },\n            { id: 'desp-sg', t: 'Serviços Gerais', d: 'notas · transp. · galpão · TI' },\n          ] },\n          { id: 'producao', t: 'Produção', d: 'Gerente de Produção', children: [\n            { id: 'prod-aux', t: 'Aux. de Produção', d: 'resp. ao Líder da mesa' },\n            { id: 'prod-coord', t: 'Coord. de Produção', d: 'auxilia planejamento' },\n            { id: 'prod-sg', t: 'Serviços Gerais', d: 'notas · transp. · galpão · TI' },\n          ] },\n          { id: 'projetos', t: 'Projetos', n: 'Viviane', d: 'Gestora de Projetos', children: [\n            { id: 'proj-estag', t: 'Estagiária de Processos', d: 'resp. ao diretor e à gestora' },\n          ] },\n        ] },\n      ],\n      larissa: { id: 'larissa', t: 'LARISSA', d: 'gestora administrativa · cruza as 3 frentes', color: 'var(--color-gray-600)', rgb: '110,110,122', dot: '#B0B0BC', st: 'admin', children: [\n        { id: 'rh', t: 'RH e DP', children: [ { id: 'rh-assist', t: 'Assistente de RH' } ] },\n        { id: 'fin', t: 'Financeiro', children: [ { id: 'fin-assist', t: 'Assistente Financeiro' } ] },\n        { id: 'compras', t: 'Compras', children: [ { id: 'compras-assist', t: 'Assistente de Compras' } ] },\n        { id: 'fiscal', t: 'Fiscal', children: [ { id: 'fiscal-ext', t: 'Contabilidade Externa', d: 'externa' } ] },\n      ] },\n    };\n  }\n\n  badge(st) {\n    const map = {\n      f1: { label: 'Fase 1', color: '#7BB1E0', bg: 'rgba(33,113,189,0.18)' },\n      f2: { label: 'Fase 2', color: '#F78D3E', bg: 'rgba(232,93,10,0.18)' },\n      f3: { label: 'Fase 3', color: '#B0B0BC', bg: 'rgba(255,255,255,0.08)' },\n      vaga: { label: 'Vaga / transição', color: '#F78D3E', bg: 'rgba(232,93,10,0.15)' },\n      admin: { label: 'Admin', color: '#B0B0BC', bg: 'rgba(255,255,255,0.08)' },\n    };\n    return map[st] || null;\n  }\n\n  select(id) {\n    this.setState(s => ({ sel: s.sel === id ? null : id }));\n  }\n\n  _enrich(node, fr) {\n    this._flat[node.id] = { raw: node, fr };\n    const b = this.badge(node.st);\n    const kids = (node.children || []).map(c => this._enrich(c, fr));\n    const sel = this.state.sel === node.id;\n    const dashed = node.st === 'vaga';\n    const cardStyle = 'display:flex; gap:8px; align-items:flex-start; padding:8px 11px; background:rgba(255,255,255,0.11); border:1px ' +\n      (dashed ? 'dashed rgba(255,255,255,0.4)' : 'solid rgba(255,255,255,0.22)') + '; border-radius:14px; cursor:pointer; text-align:left; box-sizing:border-box; width:100%; transition:border-color 140ms cubic-bezier(0.4,0,0.2,1), box-shadow 140ms cubic-bezier(0.4,0,0.2,1);' +\n      (sel ? ' border-color:rgba(247,141,62,0.9); box-shadow:0 0 0 1px rgba(232,93,10,0.5), 0 0 22px rgba(232,93,10,0.35);' : '');\n    return {\n      id: node.id, t: node.t,\n      sub: [node.n, node.d].filter(Boolean).join(' · '),\n      hasBadge: !!b, badge: b ? b.label : '',\n      badgeStyle: b ? ('font-size:9px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:2px 6px; border-radius:999px; color:' + b.color + '; background:' + b.bg + '; white-space:nowrap;') : '',\n      dotColor: fr.dot,\n      hasChildren: kids.length > 0, children: kids,\n      hasCard: !!node.card,\n      onSelect: () => this.select(node.id),\n      cardStyle,\n    };\n  }\n\n  _buildCard(entry) {\n    if (!entry) return null;\n    const raw = entry.raw;\n    const fr = entry.fr;\n    const b = this.badge(raw.st);\n    const base = {\n      frente: fr.name, frenteColor: fr.color,\n      statusLabel: b ? b.label : '',\n      nameLine: [raw.n, raw.d].filter(Boolean).join(' · ') || '—',\n    };\n    if (raw.card && this.CARDS()[raw.card]) {\n      const c = this.CARDS()[raw.card];\n      return { ...base, ...c, hasFull: true, isLight: false, hasPendencias: (c.pendencias || []).length > 0, cargo: c.cargo, respondeA: c.respondeA };\n    }\n    const equipe = (raw.children || []).map(ch => ({ t: ch.t, sub: [ch.n, ch.d].filter(Boolean).join(' · ') }));\n    return {\n      ...base, hasFull: false, isLight: true, cargo: raw.t, respondeA: '',\n      equipe, hasEquipe: equipe.length > 0,\n      escopo: [], resultados: [], n1: [], n2: [], n3: [], kpis: [], pendencias: [], hasPendencias: false,\n      missao: '', fronteira: '', reversibilidade: '', calibracao: '', kpiSupremo: '',\n    };\n  }\n\n  _frenteName(color) {\n    const d = this.DATA();\n    const f = d.frentes.find(x => x.color === color);\n    if (f) return f.t;\n    return 'Suporte transversal';\n  }\n\n  renderVals() {\n    this._flat = {};\n    const data = this.DATA();\n\n    const headBase = 'display:block; width:100%; border-radius:18px; padding:14px 18px; margin-bottom:14px; color:#fff; cursor:pointer; text-align:left; box-sizing:border-box; transition:box-shadow 140ms, border-color 140ms;';\n    const frentes = data.frentes.map(f => {\n      const sel = this.state.sel === f.id;\n      const fr = { color: f.color, rgb: f.rgb, dot: f.dot, name: f.t };\n      this._flat[f.id] = { raw: f, fr };\n      return {\n        t: f.t, d: f.d,\n        headStyle: headBase + 'background:rgba(' + f.rgb + ',0.16); border:1px solid rgba(' + f.rgb + ',0.55); box-shadow:0 0 26px rgba(' + f.rgb + ',' + (sel ? '0.4' : '0.15') + ');' + (sel ? ' border-color:rgba(247,141,62,0.9);' : ''),\n        onSelect: () => this.select(f.id),\n        trees: f.children.map(c => this._enrich(c, fr)),\n      };\n    });\n\n    const lz = data.larissa;\n    const lzFr = { color: lz.color, rgb: lz.rgb, dot: lz.dot, name: 'Suporte transversal' };\n    this._flat[lz.id] = { raw: lz, fr: lzFr };\n    const lzSel = this.state.sel === lz.id;\n    const larissa = {\n      t: lz.t, d: lz.d,\n      headStyle: headBase + 'background:rgba(' + lz.rgb + ',0.16); border:1px solid rgba(' + lz.rgb + ',0.5); box-shadow:0 0 26px rgba(' + lz.rgb + ',' + (lzSel ? '0.4' : '0.12') + ');' + (lzSel ? ' border-color:rgba(247,141,62,0.9);' : ''),\n      onSelect: () => this.select(lz.id),\n      trees: lz.children.map(c => this._enrich(c, lzFr)),\n    };\n\n    const chip = 'width:12px; height:12px; border-radius:3px; display:inline-block;';\n    const legend = [\n      { name: 'Atual', chip: chip + 'background:var(--color-blue-400);' },\n      { name: 'Fase 2', chip: chip + 'background:var(--color-orange-400);' },\n      { name: 'Fase 3', chip: chip + 'background:var(--color-gray-400);' },\n      { name: 'Vaga / transição', chip: chip + 'background:transparent; border:2px dashed var(--color-gray-300);' },\n      { name: 'Admin (Larissa)', chip: chip + 'background:var(--color-gray-600);' },\n    ];\n\n    return {\n      companyName: this.props.companyName || 'GRUPO SHRIGMA',\n      frentes, larissa, legend,\n      selectedCard: this._buildCard(this._flat[this.state.sel]),\n      closePanel: () => this.setState({ sel: null }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
