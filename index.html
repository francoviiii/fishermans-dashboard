<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Marketing | Fishermans & Aristocrata</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#F4F5F7;color:#1A1A2E;min-height:100vh}
.topbar{background:#1A1A2E;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:10px}
.back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;display:none;align-items:center;gap:5px}
.back-btn:hover{background:rgba(255,255,255,.25)}
.topbar-title{color:#fff;font-size:13px;font-weight:600}
.updated{color:rgba(255,255,255,.4);font-size:10px;margin-left:8px}
.tog-grp{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:8px}
.tog{padding:4px 13px;border-radius:6px;border:none;font-size:11px;cursor:pointer;background:transparent;color:rgba(255,255,255,.7);font-weight:500;transition:all .15s}
.tog.on{background:#fff;color:#1A1A2E}
.content{padding:14px 18px;max-width:1080px;margin:0 auto}

/* Area cards */
.area-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.area-card{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;border:1.5px solid transparent;transition:transform .15s,box-shadow .15s}
.area-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.ac-hdr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.ac-title{color:#fff;font-size:12px;font-weight:700}
.ac-body{padding:10px 14px}
.ac-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:0.5px solid #F5F5F5}
.ac-row:last-child{border:none}
.ac-lbl{color:#888}.ac-val{font-weight:700}
.ac-footer{padding:7px 14px;font-size:10px;font-weight:600;text-align:center;border-top:1px solid #F5F5F5}

/* KPI overview */
.kpi-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.kpi-ov{background:#fff;border-radius:10px;padding:11px 13px;border:1px solid #EBEBEB}
.kpi-ov-lbl{font-size:10px;color:#888;margin-bottom:3px}
.kpi-ov-val{font-size:20px;font-weight:700}
.kpi-ov-sub{font-size:10px;margin-top:1px}
.up{color:#2E7D32}.dn{color:#C62828}.neu{color:#888}

/* DETAIL SCREEN */
.screen{display:none}.screen.active{display:block}
.det-header{background:#fff;border-radius:10px;padding:13px 16px;margin-bottom:12px;border:1px solid #EBEBEB}
.det-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.det-accent{width:4px;border-radius:2px;height:30px;flex-shrink:0}
.det-title{font-size:15px;font-weight:700}
.det-sub{font-size:11px;color:#888}

/* 3-level result blocks */
.level-section{background:#fff;border-radius:10px;border:1px solid #EBEBEB;margin-bottom:10px;overflow:hidden}
.level-hdr{padding:9px 14px;display:flex;align-items:center;justify-content:space-between}
.level-hdr-title{font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.level-hdr-sub{font-size:10px;color:rgba(255,255,255,.7)}
.level-body{padding:12px 14px}

/* Metrics table */
.metrics-table{width:100%;border-collapse:collapse;font-size:11px}
.metrics-table th{background:#F8F8F8;padding:6px 10px;text-align:center;font-weight:600;color:#555;border-bottom:1px solid #EBEBEB}
.metrics-table th:first-child{text-align:left}
.metrics-table td{padding:6px 10px;border-bottom:0.5px solid #F5F5F5;text-align:center}
.metrics-table td:first-child{text-align:left;font-weight:500;color:#333}
.metrics-table tr:last-child td{border-bottom:none}
.metrics-table .media-row td{background:#F0FFF4;font-weight:700;color:#1B5E20}
.metrics-table .media-row td:first-child{color:#1B5E20}
.null-val{color:#CCC}

/* Seller cards */
.sellers-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sc{background:#fff;border-radius:10px;padding:11px;border:1px solid #EBEBEB}
.sc-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-bottom:7px}
.sc-name{font-size:12px;font-weight:700;margin-bottom:1px}
.sc-role{font-size:10px;color:#888;margin-bottom:7px}
.sc-row{display:flex;justify-content:space-between;font-size:10px;padding:2px 0;border-bottom:0.5px solid #F5F5F5}
.sc-row:last-of-type{border:none}
.sc-lbl{color:#888}.sc-val{font-weight:600}
.prog-bg{background:#F0F0F0;border-radius:3px;height:5px;margin-top:7px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px}
.prog-lbl{font-size:9px;text-align:right;margin-top:2px;font-weight:600}

.alert{padding:7px 11px;border-radius:8px;margin-bottom:6px;font-size:11px;border-left:3px solid;display:flex;gap:8px}
.alert.warn{background:#FFF8E1;border-color:#F9A825;color:#5D4037}
.alert.ok{background:#E8F5E9;border-color:#4CAF50;color:#1B5E20}
.na-box{padding:30px;text-align:center;color:#888;background:#fff;border-radius:10px;border:1px solid #EBEBEB}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.chart-card{background:#fff;border-radius:10px;padding:12px;border:1px solid #EBEBEB}
.chart-lbl{font-size:11px;font-weight:600;color:#555;margin-bottom:8px}
@media(max-width:580px){.area-cards,.sellers-row,.c2{grid-template-columns:1fr}}
</style>
</head>

function fmt(x,type='num'){
  if(x===null||x===undefined)return'<span class="null-val">—</span>';
  if(type==='brl'){
    if(Math.abs(x)>=1e6)return'R$ '+( x/1e6).toFixed(1)+'M';

// ── TABLE BUILDER ──────────────────────────────────────────
function metricTable(metrics, rows){
  // metrics: [{key, label, type}]
  // rows: [{label, data_obj, isMedia}]
  const cols = per===0
    ? ['Total Mês','Média Sem.']
    : [WKS[per-1],'Média Sem.'];

  let th = '<tr><th>Métrica</th>';
  if(per===0){
    th += '<th>Total Mês</th><th>Média Sem.</th>';
  } else {
    th += `<th>${WKS[per-1]}</th><th>Média Sem.</th>`;
  }
  th += '</tr>';

  let tbody='';
  for(const m of metrics){
    tbody+='<tr>';
    tbody+=`<td>${m.label}</td>`;
    if(per===0){
      tbody+=`<td>${fmt(rows.mensal?.[m.key]??null,m.type)}</td>`;
      tbody+=`<td style="color:#1B5E20;font-weight:600">${fmt(rows.media?.[m.key]??null,m.type)}</td>`;
    }else{
      tbody+=`<td>${fmt(rows.semanas?.[per-1]?.[m.key]??null,m.type)}</td>`;
      tbody+=`<td style="color:#1B5E20;font-weight:600">${fmt(rows.media?.[m.key]??null,m.type)}</td>`;
    }
    tbody+='</tr>';
  }
  return `<table class="metrics-table"><thead>${th}</thead><tbody>${tbody}</tbody></table>`;
}

  document.getElementById('screen-home').innerHTML=`
    <div style="font-size:11px;color:#888;margin-bottom:8px">Selecione uma semana ou "Mensal" no topo → clique em uma área para ver os detalhes</div>

}

// ── VENDAS ─────────────────────────────────────────────────
function renderVendas(){
  const el=document.getElementById('screen-vendas');
  if(co!=='fish'||!D[co].vendas){
    el.innerHTML='<div class="na-box"><div style="font-size:28px;margin-bottom:8px">💼</div><div style="font-weight:600;margin-bottom:4px">Área de Vendas</div>Exclusiva da Fishermans. Selecione Fishermans para ver os resultados.</div>';
    return;
  }
  const vd=D[co].vendas;
  const eq=vd.equipe;

  const eq_metrics=[
    {key:'fat',label:'Faturamento R$',type:'brl'},
    {key:'vendas',label:'Vendas Fechadas',type:'num'},
    {key:'leads',label:'Leads Recebidos',type:'num'},
    {key:'cvr',label:'CVR %',type:'pct'},
    {key:'ticket',label:'Ticket Médio R$',type:'brl'},
    {key:'nps',label:'NPS',type:'dec'},
  ];

  const sel_metrics=[
    {key:'fat',label:'Faturamento R$',type:'brl'},
    {key:'vendas',label:'Vendas Fechadas',type:'num'},
    {key:'leads',label:'Leads',type:'num'},
    {key:'cvr',label:'CVR %',type:'pct'},
    {key:'ticket',label:'Ticket Médio R$',type:'brl'},
    {key:'nps',label:'NPS',type:'dec'},
  ];

  const selCards=(vd.sellers||[]).map((s,i)=>{
    const si=SELLERS_INFO[i]||SELLERS_INFO[0];
    const pct=s.mensal?.pct_meta;
    const bc=pct>=100?'#2E7D32':pct>=80?'#F57F17':'#C62828';
    const cur=per===0?s.mensal:s.semanas?.[per-1]||{};
    return `<div class="sc">
      <div class="sc-av" style="background:${si.col}">${si.ini}</div>
      <div class="sc-name" style="color:${si.col}">${s.nome}</div>
      <div class="sc-role">${si.role}</div>
      <div class="sc-row"><span class="sc-lbl">Faturamento</span><span class="sc-val">${fmt(cur?.fat,'brl')}</span></div>
      <div class="sc-row"><span class="sc-lbl">Vendas</span><span class="sc-val">${cur?.vendas??'—'}</span></div>
      <div class="sc-row"><span class="sc-lbl">CVR</span><span class="sc-val">${fmt(cur?.cvr,'pct')}</span></div>
      <div class="sc-row"><span class="sc-lbl">Ticket</span><span class="sc-val">${fmt(cur?.ticket,'brl')}</span></div>
      <div class="sc-row"><span class="sc-lbl">NPS</span><span class="sc-val">${fmt(cur?.nps,'dec')}</span></div>
      ${pct?`<div class="prog-bg"><div class="prog-fill" style="width:${Math.min(pct,100)}%;background:${bc}"></div></div>
      <div class="prog-lbl" style="color:${bc}">${pct.toFixed(0)}% da meta</div>`:''}
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="det-header">
      <div class="det-top">
        <div class="det-accent" style="background:#C62828"></div>
        <div><div class="det-title">Vendas — Fishermans</div>
        <div class="det-sub">Equipe: Leandro · Guilherme · Vinicius</div></div>
      </div>
    </div>
    <div class="level-section">
      <div class="level-hdr" style="background:#C62828">
        <span class="level-hdr-title">💰 Resultado da Equipe</span>
        <span class="level-hdr-sub">consolidado</span>
      </div>
      <div class="level-body">${metricTable(eq_metrics,eq)}</div>
    </div>
    <div class="level-section">
      <div class="level-hdr" style="background:#880E4F">
        <span class="level-hdr-title">👤 Resultado Individual</span>
        <span class="level-hdr-sub">por vendedor</span>
      </div>
      <div class="level-body">
        <div class="sellers-row">${selCards}</div>
        ${(vd.sellers||[]).map((s,i)=>{
          const si=SELLERS_INFO[i]||SELLERS_INFO[0];
          return `<div style="font-size:11px;font-weight:600;color:${si.col};margin-bottom:6px;margin-top:8px">${s.nome}</div>
          ${metricTable(sel_metrics,s)}`;
        }).join('')}
      </div>
    </div>`;
}

function goHome(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-home').classList.add('active');
  document.getElementById('back-btn').style.display='none';
  document.getElementById('top-title').innerHTML='Dashboard Marketing <span class="updated">atualizado 26/05/2026</span>';
  curScreen='home'; renderHome();
}

function goScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('back-btn').style.display='flex';
  const titles={creative:'Creative Strategist',marketplace:'Marketplace',trafego:'Tráfego Pago',vendas:'Vendas'};
  document.getElementById('top-title').textContent=titles[name];
  curScreen=name; renderScreen();
}

function renderScreen(){
  if(curScreen==='home')renderHome();
  else if(curScreen==='creative')renderCreative();
  else if(curScreen==='marketplace')renderMarketplace();
  else if(curScreen==='trafego')renderTrafego();
  else if(curScreen==='vendas')renderVendas();
}

function setCo(c){
  co=c;
  document.querySelectorAll('.tog-grp:first-child .tog').forEach((t,i)=>t.classList.toggle('on',i===(c==='fish'?0:1)));
  dc(); renderScreen();
}
function setPer(p){
  per=p;
  document.querySelectorAll('.tog-grp:last-child .tog').forEach((t,i)=>t.classList.toggle('on',i===(p===0?4:p-1)));
  dc(); renderScreen();
}
renderHome();
</script>
