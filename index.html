function fmtN(x,type){
  if(x===null||x===undefined||x==='')return '<span class="null-v">—</span>';
  const n=parseFloat(x);
  if(isNaN(n))return '<span class="null-v">—</span>';
  if(type==='brl'){
    if(Math.abs(n)>=1e6)return 'R$ '+(n/1e6).toFixed(1)+'M';
    if(Math.abs(n)>=1000)return 'R$ '+(n/1000).toFixed(0)+'k';
    return 'R$ '+Math.round(n).toLocaleString('pt-BR');
  }
  if(type==='pct')return n.toFixed(1)+'%';
  if(type==='x')return n.toFixed(1)+'x';
  if(type==='dec')return n.toFixed(1);
  if(type==='int')return Math.round(n).toString();
  return n%1===0?n.toString():n.toFixed(1);
}

function semV(obj,key){
  return (obj.semanas||[]).map(s=>{ const v=s?.[key]; return (v===null||v===undefined)?null:parseFloat(v)||null; });
}

function cht(id,cfg){
  const el=document.getElementById(id);
  if(!el)return;
  try{charts[id]=new Chart(el,cfg);}catch(e){console.warn('chart err',id,e);}
}

function barOpts(yFmt,xLbls){
  return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{y:{ticks:{callback:yFmt,font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}},
            x:{ticks:{labels:xLbls,font:{size:10}},grid:{display:false}}}};
}
function lineOpts(yFmt){
  return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{y:{ticks:{callback:yFmt,font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}},
            x:{ticks:{font:{size:10}},grid:{display:false}}}};
}

function buildTable(metrics,dataObj){
  const ms=dataObj.mensal||{}, sem=dataObj.semanas||[], md=dataObj.media||{};
  let h='<tr><th>Métrica</th>';
  h+=per===0?'<th class="th-m">Total Mês</th>':'<th class="th-m">'+WKSF[per-1]+'</th>';
  h+='<th class="th-av">Média Semanal</th></tr>';
  let b='';
  for(const m of metrics){
    const cv=per===0?ms[m.key]:(sem[per-1]||{})[m.key];
    const av=md[m.key];
    b+='<tr><td>'+m.label+'</td><td class="td-m">'+fmtN(cv,m.type)+'</td><td class="td-av">'+fmtN(av,m.type)+'</td></tr>';
  }
  return '<table class="mt"><thead>'+h+'</thead><tbody>'+b+'</tbody></table>';
}

    {key:'gasto',label:'Gasto Mídia R$',type:'brl'},{key:'mc',label:'MC Aquisição R$',type:'brl'},
    {key:'nnc',label:'NNC — Novos Clientes',type:'int'},{key:'cpm',label:'CPM R$',type:'brl'},
    {key:'ctr',label:'CTR %',type:'pct'},{key:'cvr',label:'CVR Checkout %',type:'pct'},
  ];
  document.getElementById('screen-trafego').innerHTML=
    '<div class="det-hdr"><div class="det-top"><div class="det-accent" style="background:#1565C0"></div>'+
    '<div><div class="det-title">Tráfego Pago — '+sub+'</div>'+
    '<div class="det-sub">Aquisição e eficiência · '+(per===0?'Mensal acumulado':WKSF[per-1])+'</div></div></div></div>'+
    '<div class="charts-row">'+
    '<div class="chart-card"><div class="chart-lbl">NNC — Novos clientes por semana</div><div style="position:relative;height:155px"><canvas id="tr-nn" role="img" aria-label="NNC">NNC</canvas></div></div>'+
    '<div class="chart-card"><div class="chart-lbl">aMER — Eficiência de aquisição</div><div style="position:relative;height:155px"><canvas id="tr-am" role="img" aria-label="aMER">aMER</canvas></div></div>'+
    '</div><div class="charts-row">'+
    '<div class="chart-card"><div class="chart-lbl">MC Aquisição R$ — semanal</div><div style="position:relative;height:150px"><canvas id="tr-mc" role="img" aria-label="MC">MC</canvas></div></div>'+
    '<div class="chart-card"><div class="chart-lbl">CPM R$ e CTR %</div>'+
    '<div class="ch-leg"><span><span class="ch-sq" style="background:#1565C0"></span>CPM R$</span><span><span class="ch-sq" style="background:#42A5F5"></span>CTR %</span></div>'+
    '<div style="position:relative;height:130px"><canvas id="tr-cc" role="img" aria-label="CPM CTR">CPM CTR</canvas></div></div>'+
    '</div>'+
    '<div class="lvl-sec"><div class="lvl-hdr" style="background:#1565C0"><span class="lvl-hdr-title">📈 Métricas de Aquisição</span></div><div class="lvl-body">'+buildTable(ms,d)+'</div></div>';
  setTimeout(function(){
    const nn=semV(d,'nnc'),am=semV(d,'amer'),mc=semV(d,'mc'),cp=semV(d,'cpm'),ct=semV(d,'ctr');
    const hs=function(v){return v.some(function(x){return x!==null;});};
    if(hs(nn))cht('tr-nn',{type:'bar',data:{labels:WKS,datasets:[{data:nn,backgroundColor:'rgba(21,101,192,.75)',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}},x:{ticks:{font:{size:10}},grid:{display:false}}}}});
    if(hs(am))cht('tr-am',{type:'line',data:{labels:WKS,datasets:[{data:am,borderColor:'#1565C0',backgroundColor:'rgba(21,101,192,.1)',pointRadius:5,tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y.toFixed(1)+'x';}}}},scales:{y:{ticks:{callback:function(v){return v+'x';},font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}},x:{ticks:{font:{size:10}},grid:{display:false}}}}});
    if(hs(mc))cht('tr-mc',{type:'bar',data:{labels:WKS,datasets:[{data:mc,backgroundColor:'rgba(66,165,245,.75)',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return 'R$'+(v>=1000?(v/1000).toFixed(0)+'k':v);},font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}},x:{ticks:{font:{size:10}},grid:{display:false}}}}});
    if(hs(cp)||hs(ct))cht('tr-cc',{type:'bar',data:{labels:WKS,datasets:[{label:'CPM',data:cp,backgroundColor:'rgba(21,101,192,.7)',borderRadius:3,yAxisID:'y'},{label:'CTR',data:ct,backgroundColor:'rgba(66,165,245,.7)',borderRadius:3,yAxisID:'y2'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return 'R$'+v;},font:{size:9}},grid:{color:'rgba(0,0,0,.05)'}},y2:{position:'right',ticks:{callback:function(v){return v+'%';},font:{size:9}},grid:{display:false}},x:{ticks:{font:{size:10}},grid:{display:false}}}}});
  },100);
}

// ── VENDAS ────────────────────────────────────────────────
function renderVendas(){
  const el=document.getElementById('screen-vendas');
  if(co!=='fish'||!D[co].vendas){
    el.innerHTML='<div class="na-box"><div style="font-size:28px;margin-bottom:8px">💼</div><div style="font-weight:700;margin-bottom:6px">Área de Vendas</div>Exclusiva da Fishermans.</div>';
    return;
  }
  const vd=D[co].vendas;
  const eq_ms=[
    {key:'fat',label:'Faturamento R$',type:'brl'},{key:'vendas',label:'Vendas Fechadas',type:'int'},
    {key:'leads',label:'Leads Recebidos',type:'int'},{key:'cvr',label:'CVR %',type:'pct'},
    {key:'ticket',label:'Ticket Médio R$',type:'brl'},{key:'nps',label:'NPS Médio',type:'dec'},
  ];
  const sel_ms=[
    {key:'fat',label:'Faturamento R$',type:'brl'},{key:'vendas',label:'Vendas Fechadas',type:'int'},
    {key:'leads',label:'Leads',type:'int'},{key:'cvr',label:'CVR %',type:'pct'},
    {key:'ticket',label:'Ticket Médio R$',type:'brl'},{key:'nps',label:'NPS',type:'dec'},
  ];

  // Seller cards
  const selCards=(vd.sellers||[]).map(function(s,i){
    const si=SI[i]||SI[0];
    const pct=s.mensal?s.mensal.pct_meta:null;
    const cv=per===0?s.mensal:((s.semanas||[])[per-1]||{});
    const bc=pct>=100?'#2E7D32':pct>=80?'#F57F17':'#C62828';
    return '<div class="sc">'+
      '<div class="sc-av" style="background:'+si.col+'">'+si.ini+'</div>'+
      '<div class="sc-name" style="color:'+si.col+'">'+s.nome+'</div>'+
      '<div class="sc-role">'+si.role+'</div>'+
      '<div class="sc-row"><span class="sc-lbl">Faturamento</span><span class="sc-val">'+fmtN(cv?cv.fat:null,'brl')+'</span></div>'+
      '<div class="sc-row"><span class="sc-lbl">Vendas</span><span class="sc-val">'+(cv&&cv.vendas!=null?Math.round(cv.vendas):'—')+'</span></div>'+
      '<div class="sc-row"><span class="sc-lbl">CVR</span><span class="sc-val">'+fmtN(cv?cv.cvr:null,'pct')+'</span></div>'+
      '<div class="sc-row"><span class="sc-lbl">Ticket</span><span class="sc-val">'+fmtN(cv?cv.ticket:null,'brl')+'</span></div>'+
      (pct!==null?'<div class="prog-bg"><div class="prog-fill" style="width:'+Math.min(pct,100)+'%;background:'+bc+'"></div></div><div class="prog-lbl" style="color:'+bc+'">'+pct.toFixed(0)+'% da meta</div>':'')+
    '</div>';
  }).join('');

  // Per-seller detailed tables
  const selTables=(vd.sellers||[]).map(function(s,i){
    const si=SI[i]||SI[0];
    return '<div style="margin-bottom:14px">'+
      '<div style="font-size:12px;font-weight:700;color:'+si.col+';margin-bottom:6px;display:flex;align-items:center;gap:6px">'+
      '<div style="width:10px;height:10px;border-radius:50%;background:'+si.col+'"></div>'+s.nome+' — '+si.role+'</div>'+
      buildTable(sel_ms,s)+'</div>';
  }).join('');

  el.innerHTML=
    '<div class="det-hdr"><div class="det-top"><div class="det-accent" style="background:#C62828"></div>'+
    '<div><div class="det-title">Vendas — Fishermans</div>'+
    '<div class="det-sub">Equipe: Leandro · Guilherme · Vinicius · '+(per===0?'Mensal acumulado':WKSF[per-1])+'</div></div></div></div>'+
    '<div class="charts-row">'+
    '<div class="chart-card"><div class="chart-lbl">Faturamento por vendedor</div>'+
    '<div class="ch-leg">'+SI.map(function(s){return '<span><span class="ch-sq" style="background:'+s.col+'"></span>'+s.name+'</span>';}).join('')+'</div>'+
    '<div style="position:relative;height:145px"><canvas id="vd-fat" role="img" aria-label="Faturamento vendedor">Faturamento</canvas></div></div>'+
    '<div class="chart-card"><div class="chart-lbl">CVR % por vendedor — semanal</div>'+
    '<div class="ch-leg">'+SI.map(function(s){return '<span><span class="ch-sq" style="background:'+s.col+'"></span>'+s.name+'</span>';}).join('')+'</div>'+
    '<div style="position:relative;height:145px"><canvas id="vd-cvr" role="img" aria-label="CVR vendedor">CVR</canvas></div></div>'+
    '</div>'+
    '<div class="lvl-sec"><div class="lvl-hdr" style="background:#C62828"><span class="lvl-hdr-title">💰 Resultado da Equipe — Consolidado</span></div><div class="lvl-body">'+buildTable(eq_ms,vd.equipe)+'</div></div>'+
    '<div class="lvl-sec"><div class="lvl-hdr" style="background:#880E4F"><span class="lvl-hdr-title">👤 Resumo Individual</span></div><div class="lvl-body"><div class="sellers-grid">'+selCards+'</div></div></div>'+
    '<div class="lvl-sec"><div class="lvl-hdr" style="background:#AD1457"><span class="lvl-hdr-title">📊 Detalhe Individual — com Média Semanal</span></div><div class="lvl-body">'+selTables+'</div></div>';

  setTimeout(function(){
    // Faturamento por vendedor (bar comparativo)
    const fatData=(vd.sellers||[]).map(function(s){
      const v=per===0?(s.mensal?s.mensal.fat:null):((s.semanas||[])[per-1]?.fat||null);
      return parseFloat(v)||0;
    });
    cht('vd-fat',{type:'bar',data:{labels:SI.map(function(s){return s.name;}),datasets:[{data:fatData,backgroundColor:SI.map(function(s){return s.col;}),borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{ticks:{callback:function(v){return 'R$'+(v>=1000?(v/1000).toFixed(0)+'k':v);},font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}},x:{ticks:{font:{size:11}},grid:{display:false}}}}});
    // CVR semanal por vendedor (line)
    const cvrDS=(vd.sellers||[]).map(function(s,i){
      return{label:s.nome,data:semV(s,'cvr'),borderColor:SI[i].col,pointRadius:4,tension:.3,
        borderDash:i===0?[]:i===1?[5,3]:[2,2]};
    });
    const hasCvr=cvrDS.some(function(ds){return ds.data.some(function(x){return x!==null;});});
    if(hasCvr)cht('vd-cvr',{type:'line',data:{labels:WKS,datasets:cvrDS},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+c.parsed.y+'%';}}}},
        scales:{y:{ticks:{callback:function(v){return v+'%';},font:{size:10}},grid:{color:'rgba(0,0,0,.05)'}},x:{ticks:{font:{size:10}},grid:{display:false}}}}});
  },100);
}

function renderScreen(){
  if(cur==='home')renderHome();
  else if(cur==='creative')renderCreative();
  else if(cur==='marketplace')renderMarketplace();
  else if(cur==='trafego')renderTrafego();
  else if(cur==='vendas')renderVendas();
}
function goHome(){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById('screen-home').classList.add('active');
  document.getElementById('back-btn').style.display='none';
  document.getElementById('tb-title').innerHTML='Dashboard Marketing <span class="updated" id="updated-lbl">atualizado '+TODAY+'</span>';
  dc(); cur='home'; curCh='GERAL'; renderHome();
}
function goScreen(name){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('back-btn').style.display='flex';
  const T={creative:'Creative Strategist',marketplace:'Marketplace',trafego:'Tráfego Pago',vendas:'Vendas'};
  document.getElementById('tb-title').textContent=T[name];
  dc(); cur=name; renderScreen();
}
function setCo(c){
  co=c; curCh='GERAL';
  document.querySelectorAll('#co-grp .tog').forEach(function(t,i){t.classList.toggle('on',i===(c==='fish'?0:1));});
  dc(); renderScreen();
}
function setPer(p){
  per=p;
  document.querySelectorAll('#per-grp .tog').forEach(function(t,i){t.classList.toggle('on',i===(p===0?4:p-1));});
  dc(); renderScreen();
}
renderHome();
</script>
